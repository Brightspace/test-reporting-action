name: Update Dependencies
permissions:
  contents: read
  pull-requests: write
on:
  schedule:
    - cron: 0 9 * * 1-5 # Mon-Fri 5:00am EDT/4:00am EST
  workflow_dispatch: # manual trigger
concurrency: update-dependencies
jobs:
  update:
    name: Update Dependencies
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: Brightspace/third-party-actions@actions/checkout
        with:
          token: ${{secrets.PR_MANAGE_TOKEN}}
      - name: Set up node
        uses: Brightspace/setup-node@main
        with:
          node-version-file: .nvmrc
          cache: npm
          d2l-registry-token: ${{ secrets.D2L_PACKAGE_REGISTRY_AUTH_TOKEN }}
      - name: Update package-lock.json
        uses: BrightspaceUI/actions/update-package-lock@main
        with:
          APPROVAL_TOKEN: ${{github.token}}
          AUTO_MERGE_METHOD: squash
          AUTO_MERGE_TOKEN: ${{secrets.PR_MANAGE_TOKEN}}
          GITHUB_TOKEN: ${{secrets.PR_MANAGE_TOKEN}}
          COMMIT_MESSAGE: Update Dependencies
          PR_TITLE: Update Dependencies
          SLACK_CHANNEL_FAILURE: '#quality-enablement-alerts'
          SLACK_CHANNEL_STALE_PR: '#quality-enablement-alerts'
          SLACK_TOKEN: ${{secrets.D2L_SLACK_TOKEN}}
      - name: Build
        run: npm run build
      - name: Update build files
        id: build-changes
        run: |
          git add dist/*
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Update Build"
          git push origin HEAD:ghworkflow/package_lock_auto_update
          echo "updated=true" >> "$GITHUB_OUTPUT"
      - name: Approve build changes
        if: steps.build-changes.outputs.updated == 'true'
        run: gh pr review --approve "$(gh pr view --json url --jq .url)"
        env:
          GITHUB_TOKEN: ${{github.token}}
